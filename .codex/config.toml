# Repository-scoped tool configuration. Authentication remains local to each contributor.

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
auth = "oauth"
enabled = true
default_tools_approval_mode = "writes"

[mcp_servers.context7]
command = "bunx"
args = ["-y", "@upstash/context7-mcp@4.0.5"]
startup_timeout_ms = 20000

[mcp_servers.next-devtools]
command = "bunx"
args = ["next-devtools-mcp@0.4.0"]
startup_timeout_ms = 20000

[mcp_servers.resend]
url = "https://mcp.resend.com/mcp"
auth = "oauth"
enabled = true

[mcp_servers.better-auth]
url = "https://mcp.better-auth.com/mcp"
enabled = true

[mcp_servers.shadcn]
command = "bunx"
args = ["shadcn@4.21.0", "mcp"]
startup_timeout_ms = 20000

[mcp_servers.shadcn.tools.get_item_examples_from_registries]
approval_mode = "approve"

[mcp_servers.shadcn.tools.search_items_in_registries]
approval_mode = "approve"
